name: Release

# Push a tag like `v0.2.0` to build Carlo and publish a GitHub release.
# Run it manually (Actions > Release > Run workflow) to only build the packages
# and download them as workflow artifacts, without publishing a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Compiles node-pty (no Linux prebuild is published) with the runner's
      # python3/make/g++.
      - name: Install dependencies
        run: npm ci

      # Electron 43+ downloads its binary lazily; electron-builder needs it now.
      - name: Download Electron
        run: npm run electron:install

      - name: Use the tag as the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build packages
        # `--publish never`: electron-builder must not publish on its own; the
        # release job below owns that.
        run: |
          npm run build
          npx electron-builder --linux --x64 --publish never

      - name: Compute checksums
        working-directory: dist
        run: sha256sum *.deb *.tar.gz | tee SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: carlo-linux-x64
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: carlo-linux-x64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --title "Carlo ${TAG#v}" \
            --generate-notes \
            $prerelease
