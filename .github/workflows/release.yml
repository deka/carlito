name: Release

# Every push to `main` builds Carlo and publishes a GitHub release.
# The version is `<major>.<minor>` from package.json plus the workflow run
# number as patch (e.g. 0.1.42), so each release has a unique, increasing tag.
# Run it manually (Actions > Release > Run workflow) on any branch to only
# build the packages and download them as workflow artifacts.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Use the npm that wrote package-lock.json. Newer npm (11.19) rejects it
      # because optional wasm32 dependencies of rolldown are missing from it.
      - name: Pin npm
        run: npm install -g npm@11.6.1

      # Compiles node-pty (no Linux prebuild is published) with the runner's
      # python3/make/g++.
      - name: Install dependencies
        run: npm ci

      # Electron 43+ downloads its binary lazily; electron-builder needs it now.
      - name: Download Electron
        run: npm run electron:install

      - name: Compute version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          version="$base.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build packages
        # `--publish never`: electron-builder must not publish on its own; the
        # release job below owns that.
        run: |
          npm run build
          npx electron-builder --linux --x64 --publish never

      - name: Compute checksums
        working-directory: dist
        run: sha256sum *.deb *.tar.gz | tee SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: carlo-linux-x64
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Full history and tags, to list the commits since the previous release.
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: carlo-linux-x64
          path: dist

      # One line per commit since the previous release tag (merge commits of
      # the dev -> main PRs are skipped), instead of GitHub's one line per PR.
      - name: Write release notes
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            git log --no-merges --format='* %s (%h)' "${prev:+$prev..}$GITHUB_SHA"
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GH_REPO/compare/$prev...v$VERSION"
            fi
          } > "$notes"
          cat "$notes"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            # Re-run of the same workflow run: refresh the assets.
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "Carlo $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
