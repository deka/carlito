<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242933"/>
      <stop offset="1" stop-color="#2e3440"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="660" rx="24" fill="url(#bg)"/>

  <!-- Headings -->
  <text x="300" y="62" text-anchor="middle" fill="#d8dee9" font-size="30" font-weight="700">Carlo</text>
  <text x="300" y="88" text-anchor="middle" fill="#7b88a1" font-size="14">the big brother, by @rumpl</text>
  <text x="900" y="62" text-anchor="middle" fill="#88c0d0" font-size="30" font-weight="700">Carlito</text>
  <text x="900" y="88" text-anchor="middle" fill="#7b88a1" font-size="14">the little brother: petit mais costaud</text>
  <text x="600" y="70" text-anchor="middle" fill="#4c566a" font-size="26" font-weight="700">vs</text>

  <!-- ================= Carlo window ================= -->
  <g transform="translate(40 112)" filter="url(#shadow)">
    <rect width="520" height="400" rx="12" fill="#2e3440" stroke="#434c5e"/>
    <!-- title bar + menu bar -->
    <rect width="520" height="30" rx="12" fill="#3b4252"/>
    <rect y="18" width="520" height="12" fill="#3b4252"/>
    <circle cx="18" cy="15" r="5" fill="#bf616a"/><circle cx="34" cy="15" r="5" fill="#ebcb8b"/><circle cx="50" cy="15" r="5" fill="#a3be8c"/>
    <text x="260" y="20" text-anchor="middle" fill="#7b88a1" font-size="11">project — Carlo</text>
    <rect y="30" width="520" height="22" fill="#353c4a"/>
    <text x="14" y="45" fill="#7b88a1" font-size="11">File   Edit   View   Go   Help</text>
    <!-- file tree -->
    <rect y="52" width="130" height="322" fill="#2b303b"/>
    <g fill="#7b88a1" font-size="11">
      <text x="14" y="74">▾ src</text>
      <text x="28" y="94">main.ts</text>
      <text x="28" y="114" fill="#d8dee9">app.tsx</text>
      <text x="28" y="134">utils.ts</text>
      <text x="14" y="154">▸ test</text>
      <text x="14" y="174">README.md</text>
    </g>
    <!-- tabs -->
    <rect x="130" y="52" width="390" height="26" fill="#2b303b"/>
    <rect x="130" y="52" width="92" height="26" fill="#2e3440"/>
    <text x="144" y="69" fill="#d8dee9" font-size="11">app.tsx</text>
    <!-- code -->
    <g font-family="'JetBrains Mono', Menlo, monospace" font-size="11">
      <text x="150" y="104"><tspan fill="#81a1c1">import</tspan><tspan fill="#d8dee9"> { App } </tspan><tspan fill="#81a1c1">from</tspan><tspan fill="#a3be8c"> './app'</tspan></text>
      <text x="150" y="124"><tspan fill="#81a1c1">export function</tspan><tspan fill="#88c0d0"> main</tspan><tspan fill="#d8dee9">() {</tspan></text>
      <text x="166" y="144"><tspan fill="#81a1c1">const</tspan><tspan fill="#d8dee9"> root = </tspan><tspan fill="#88c0d0">render</tspan><tspan fill="#d8dee9">(App);</tspan></text>
      <text x="166" y="164"><tspan fill="#81a1c1">return</tspan><tspan fill="#d8dee9"> root;</tspan></text>
      <text x="150" y="184" fill="#d8dee9">}</text>
    </g>
    <rect x="142" y="94" width="3" height="14" fill="#a3be8c"/>
    <rect x="142" y="134" width="3" height="14" fill="#ebcb8b"/>
    <!-- status bar -->
    <rect y="374" width="520" height="26" fill="#3b4252"/>
    <rect y="374" width="520" height="14" fill="#3b4252"/>
    <text x="14" y="391" fill="#88c0d0" font-size="11">● Carlo</text>
    <text x="506" y="391" text-anchor="end" fill="#7b88a1" font-size="11">TypeScript · LSP ready</text>
  </g>

  <!-- ================= Carlito window ================= -->
  <g transform="translate(640 112)" filter="url(#shadow)">
    <rect width="520" height="400" rx="12" fill="#2e3440" stroke="#88c0d0" stroke-opacity="0.55"/>
    <!-- no title bar, no menu bar: activity bar -->
    <rect width="34" height="374" rx="12" fill="#3b4252"/>
    <rect x="20" width="14" height="374" fill="#3b4252"/>
    <g fill="none" stroke="#7b88a1" stroke-width="1.6">
      <rect x="10" y="16" width="14" height="16" rx="2"/>
      <circle cx="16" cy="56" r="6" stroke="#88c0d0"/><path d="m20.5 60.5 4 4" stroke="#88c0d0"/>
      <circle cx="12" cy="88" r="3"/><circle cx="22" cy="100" r="3"/><circle cx="12" cy="108" r="3"/><path d="M12 91v14M22 97c0-5-10-4-10-6"/>
      <path d="M10 130h14M10 136h10M10 142h14"/>
    </g>
    <!-- search sidebar -->
    <rect x="34" width="150" height="374" fill="#2b303b"/>
    <text x="46" y="22" fill="#7b88a1" font-size="10" font-weight="700" letter-spacing="1.2">SEARCH</text>
    <rect x="44" y="32" width="130" height="20" rx="4" fill="#3b4252"/>
    <text x="52" y="46" fill="#d8dee9" font-size="10">render</text>
    <text x="166" y="46" text-anchor="end" fill="#88c0d0" font-size="9">Aa .*</text>
    <rect x="44" y="56" width="130" height="20" rx="4" fill="#3b4252"/>
    <text x="52" y="70" fill="#7b88a1" font-size="10">replace…</text>
    <g font-size="10">
      <text x="46" y="96" fill="#7b88a1">▾ src</text>
      <text x="58" y="114" fill="#d8dee9">app.tsx <tspan fill="#88c0d0">2</tspan></text>
      <text x="70" y="130" fill="#7b88a1"><tspan fill="#ebcb8b">render</tspan>(App)</text>
      <text x="58" y="148" fill="#d8dee9">main.ts <tspan fill="#88c0d0">1</tspan></text>
      <text x="46" y="166" fill="#7b88a1">▾ test</text>
      <text x="58" y="184" fill="#d8dee9">app.test.ts <tspan fill="#88c0d0">3</tspan></text>
    </g>
    <!-- tabs -->
    <rect x="184" width="336" height="26" fill="#2b303b"/>
    <rect x="184" width="80" height="26" fill="#2e3440"/>
    <text x="196" y="17" fill="#d8dee9" font-size="11">app.tsx</text>
    <text x="276" y="17" fill="#7b88a1" font-size="11">README.md</text>
    <!-- split: code | markdown preview -->
    <g font-family="'JetBrains Mono', Menlo, monospace" font-size="10">
      <text x="198" y="50"><tspan fill="#81a1c1">export function</tspan><tspan fill="#88c0d0"> main</tspan><tspan fill="#d8dee9">() {</tspan></text>
      <text x="210" y="68"><tspan fill="#81a1c1">const</tspan><tspan fill="#d8dee9"> root = </tspan></text>
      <text x="222" y="86"><tspan fill="#ebcb8b">render</tspan><tspan fill="#d8dee9">(App);</tspan></text>
      <text x="210" y="104"><tspan fill="#81a1c1">return</tspan><tspan fill="#d8dee9"> root;</tspan></text>
      <text x="198" y="122" fill="#d8dee9">}</text>
    </g>
    <rect x="190" y="58" width="3" height="14" fill="#a3be8c"/>
    <line x1="352" y1="26" x2="352" y2="236" stroke="#434c5e"/>
    <text x="366" y="50" fill="#eceff4" font-size="14" font-weight="700">Carlito</text>
    <rect x="366" y="58" width="140" height="5" rx="2" fill="#4c566a"/>
    <rect x="366" y="69" width="118" height="5" rx="2" fill="#4c566a"/>
    <rect x="366" y="84" width="140" height="58" rx="5" fill="#3b4252"/>
    <path d="m376 132 22-26 16 16 14-12 24 22z" fill="#5e81ac"/>
    <circle cx="470" cy="100" r="7" fill="#ebcb8b"/>
    <rect x="366" y="152" width="130" height="5" rx="2" fill="#4c566a"/>
    <text x="508" y="20" text-anchor="end" fill="#88c0d0" font-size="9">PREVIEW</text>
    <!-- terminal panel -->
    <rect x="184" y="236" width="336" height="138" fill="#272c36"/>
    <line x1="184" y1="236" x2="520" y2="236" stroke="#434c5e"/>
    <text x="196" y="254" fill="#d8dee9" font-size="10" font-weight="700">TERMINAL</text>
    <text x="262" y="254" fill="#7b88a1" font-size="10">bash   + </text>
    <g font-family="'JetBrains Mono', Menlo, monospace" font-size="10">
      <text x="196" y="278"><tspan fill="#a3be8c">you@carlito</tspan><tspan fill="#d8dee9">:~/project$ npm test</tspan></text>
      <text x="196" y="296" fill="#a3be8c">✓ 42 tests passed</text>
      <text x="196" y="314"><tspan fill="#a3be8c">you@carlito</tspan><tspan fill="#d8dee9">:~/project$ </tspan><tspan fill="#d8dee9">▌</tspan></text>
    </g>
    <!-- status bar -->
    <rect y="374" width="520" height="26" fill="#3b4252"/>
    <rect y="374" width="520" height="14" fill="#3b4252"/>
    <text x="14" y="391" fill="#88c0d0" font-size="11">● Carlito</text>
    <text x="86" y="391" fill="#d8dee9" font-size="11">⎇ dev  ●3</text>
    <text x="506" y="391" text-anchor="end" fill="#7b88a1" font-size="11"><tspan fill="#a3be8c">⬆ update ready</tspan>   TypeScript · LSP ready</text>
  </g>

  <!-- Callouts -->
  <g font-size="14">
    <text x="300" y="550" text-anchor="middle" fill="#7b88a1">File tree · tabs &amp; splits · Monaco · LSP</text>
    <text x="300" y="574" text-anchor="middle" fill="#7b88a1">quick open · command palette · git gutter</text>

    <text x="900" y="550" text-anchor="middle" fill="#d8dee9">Everything Carlo has, <tspan fill="#88c0d0" font-weight="700">plus</tspan>: search &amp; replace · Source Control</text>
    <text x="900" y="574" text-anchor="middle" fill="#d8dee9">terminal · Markdown/HTML/SVG/PDF/image previews · in-app updates</text>
    <text x="900" y="598" text-anchor="middle" fill="#7b88a1">and no menu bar or title bar: more room for the code</text>
  </g>

  <text x="600" y="640" text-anchor="middle" fill="#88c0d0" font-size="16" font-style="italic">« C’est tout pareil, mais c’est pas pareil. »</text>
</svg>
